<style>
/* Layout: consulting-firm page. Serif headlines, generous white space, thin rules, one electric-blue accent on deep ink. One job: start a WhatsApp conversation. */
:root{
  --paper:#FFFFFF; --panel:#F3F5F8; --ink:#0B1F33; --muted:#516173; --line:#DCE2E9;
  --accent:#1F5BFF; --accent-ink:#FFFFFF; --deep:#0B1F33; --deep-ink:#FFFFFF; --soft:#EAF0FF; --wa:#1F5BFF;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.62;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.005em}
h2{font-size:clamp(1.55rem,3.6vw,2.15rem)}
h3{font-size:1.12rem}
p{margin:0}
.label{font-family:var(--mono);font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
section{padding-block:60px;border-top:1px solid var(--line)}
.head{display:grid;gap:10px;margin-bottom:28px;max-width:640px}
.head p{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:Quicksand,var(--body);font-weight:300;font-size:1.42rem;color:var(--ink);text-decoration:none;letter-spacing:.01em;line-height:1}.logo .mk{display:block;flex:none}.logo b{font-weight:inherit}@media(max-width:420px){.logo{font-size:1.18rem;gap:8px}.logo .mk{width:23px;height:31px}}
.logo span{color:var(--accent)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.93rem;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:2px;padding:14px 22px;font:600 .96rem var(--body);cursor:pointer;text-decoration:none;transition:background .15s ease}
.btn-wa{background:var(--wa);color:var(--accent-ink)}
.btn-wa:hover{filter:brightness(1.08)}
.btn-sm{padding:9px 15px;font-size:.88rem}
.arrow::after{content:"→";font-family:var(--body)}

.hero{padding-block:64px 56px;border-top:0}
.hero .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:end}
.hero h1{font-size:clamp(2.1rem,5.6vw,3.5rem);font-weight:500;line-height:1.08;letter-spacing:-.015em;margin-top:16px}
.hero .lead{font-size:1.1rem;color:var(--muted);margin-top:20px;max-width:52ch}
.hero .cta{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:30px}
.hero .cta span{font-size:.88rem;color:var(--muted)}
.kpi{display:grid;gap:0;border-left:1px solid var(--line)}
.kpi div{padding:14px 0 14px 22px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.kpi div:last-child{border-bottom:0}
.kpi b{font-family:var(--display);font-size:1.7rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:.86rem;color:var(--muted)}
@media (max-width:860px){.hero .grid{grid-template-columns:1fr;gap:36px}.hero{padding-block:40px}}

.needs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.need{display:grid;gap:6px;align-content:start;padding:20px 18px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0;transition:background .15s ease}
.need:hover{background:var(--panel)}
.need b{font-family:var(--display);font-weight:600;font-size:1.06rem}
.need small{color:var(--muted);font-size:.86rem;line-height:1.45}
.need em{font-style:normal;color:var(--accent);font-size:.84rem;font-weight:600;margin-top:4px}
.need em::after{content:" →"}
@media (max-width:860px){.needs{grid-template-columns:1fr 1fr}}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tier{border-top:3px solid var(--ink);padding-top:16px;display:grid;gap:8px}
.tier .k{font-family:var(--display);font-size:2.2rem;font-weight:500;line-height:1}
.tier p{color:var(--muted);font-size:.94rem}
.tier p strong{color:var(--ink);font-weight:600}
@media (max-width:760px){.tiers{grid-template-columns:1fr}}
.note{margin-top:18px;font-size:.88rem;color:var(--muted)}

.matrix{border-top:1px solid var(--line)}
.mrow{display:grid;grid-template-columns:120px 1fr 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.mrow .who{font-family:var(--display);font-weight:600;font-size:1.05rem}
.mrow p{color:var(--muted);font-size:.94rem}
.mrow p strong{display:block;color:var(--ink);font-weight:600}
.mhead{font-size:.74rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-block:10px}
@media (max-width:700px){.mrow{grid-template-columns:1fr;gap:6px}.mhead{display:none}}

.deep{background:var(--panel);color:var(--ink)}
.deep .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:48px}
.deep h2{color:var(--ink)}
.deep .label{color:var(--accent)}
.deep p{color:var(--muted)}
.deep ol{margin:0;padding:0;list-style:none;counter-reset:d;display:grid}
.deep li{counter-increment:d;display:grid;grid-template-columns:36px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid color-mix(in srgb,var(--deep-ink) 18%,transparent)}
.deep li::before{content:counter(d,decimal-leading-zero);font-family:var(--display);color:color-mix(in srgb,var(--deep-ink) 60%,transparent)}
.deep li b{display:block;color:var(--deep-ink);font-weight:600}
.deep .btn{margin-top:24px;background:var(--accent);color:var(--accent-ink)}
@media (max-width:860px){.deep .grid{grid-template-columns:1fr;gap:28px}}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;display:grid;gap:8px}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.steps p{color:var(--muted);font-size:.95rem}
@media (max-width:700px){.steps{grid-template-columns:1fr;gap:20px}}

details{border-bottom:1px solid var(--line);padding-block:18px;max-width:780px}
details:first-of-type{border-top:1px solid var(--line)}
summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-family:var(--body)}
details[open] summary::after{content:"−"}
details p{color:var(--muted);margin-top:10px;max-width:68ch}

footer{padding-block:32px 110px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:var(--muted)}
.copy{background:transparent;border:1px solid var(--line);color:var(--ink);padding:3px 10px;font:500 .78rem var(--body);cursor:pointer;margin-left:8px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:none}
.bar .btn{width:100%}
@media (max-width:760px){.bar{display:block}.top .btn{display:none}}
@media (min-width:761px){footer{padding-bottom:40px}}

</style>
