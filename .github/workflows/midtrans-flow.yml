name: Screenshot alur transaksi Midtrans
on:
  push:
    paths: ["midtrans/trigger.txt"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node midtrans/flow.js
      - run: node midtrans/doc.js
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add midtrans/shots midtrans/*.pdf midtrans/flow.html
          git commit -m "Dokumen flow transaksi Midtrans [skip ci]" || exit 0
          git pull --rebase; git push
