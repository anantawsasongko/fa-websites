<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>Admin Asisten AI</title>
<style>
:root{--bg:#121212;--card:#1E1E1E;--line:#2F2F2F;--ink:#fff;--mut:#A8A8A8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px 60px}
small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
h1{font-family:"EB Garamond",Georgia,serif;font-weight:400;font-size:30px;margin:4px 0 18px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
h2{font-size:15px;font-weight:500;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;background:#262626;border:1px solid #4A4A4A;border-radius:6px;color:#fff;font:14px Poppins,system-ui,sans-serif;padding:10px 12px}
input:focus,select:focus{outline:none;border-color:#fff}
button{border:0;border-radius:999px;background:#fff;color:#171717;font:500 14px Poppins,system-ui,sans-serif;padding:11px 18px;cursor:pointer;margin-top:14px;width:100%}
.out{margin-top:14px;font-size:13.5px;color:#E6E6E6;white-space:pre-wrap;word-break:break-word}
.code{font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.04em;color:#fff}
.mut{color:var(--mut);font-size:12.5px}
</style>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/><style id="fa-font">:root{--body:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif}body{font-family:var(--body);font-size:16.5px;letter-spacing:.005em;font-feature-settings:"kern","liga"}p,li,dd,td,th,label,input,select,textarea,button,.btn,summary,small,span{font-family:inherit}p,.plan>p:not(.cmph),.note,.arsip li span:not(.yr),.cmp dd,.feerow span,.sysnote,.lnote{font-family:var(--body);font-size:1.02em;line-height:1.7;font-weight:400}.art p,.art li{font-family:var(--body)!important;font-size:17.5px!important;line-height:1.75!important;font-weight:400!important}.art b,.art strong{font-weight:600}.eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.2em}.btn,button,.chips2 a,.card2 b{font-family:var(--body);font-weight:600;letter-spacing:.01em}.card2 b{font-family:"Times New Roman",Times,serif;font-weight:400;font-size:19px}.dl p:not(.cmph){font-size:16px}html[lang="zh"] body{font-family:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}</style><script async="" src="https://www.googletagmanager.com/gtag/js?id=G-09VZKH3JRJ"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag("js",new Date());gtag("config","G-09VZKH3JRJ");</script><style id="tidy-prose">.tx{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0 24px;border:1px solid rgba(127,127,127,.28);border-radius:10px}.tx table{border-collapse:collapse;width:100%;min-width:560px;margin:0;font-size:.93rem;line-height:1.5}.tx th,.tx td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid rgba(127,127,127,.2);min-width:120px}.tx th{font-weight:600;background:rgba(127,127,127,.09)}.tx tr:last-child td{border-bottom:0}.tblwrap table,.scroll table{min-width:560px}.tblwrap th,.tblwrap td,.scroll th,.scroll td{min-width:120px}.prose h2,article h2{margin-top:34px;margin-bottom:12px}.prose h3,article h3{margin-top:26px;margin-bottom:8px}.prose h2+p,.prose h3+p,article h2+p,article h3+p,.faq h3+p{margin-top:8px}.prose p,article p{margin-bottom:14px}.prose li{margin-bottom:6px}.prose .tx+p,.prose table+p,.prose .scroll+p,.tblwrap+p{margin-top:18px}.prose img,article img{max-width:100%;height:auto}.prose,article{overflow-wrap:break-word}</style><style id="ecobar-css">.ecobar{background:#0B0B0C;color:#cfcfcf;font:500 12.5px/1.2 Poppins,system-ui,sans-serif;position:relative;z-index:60}.ecobar .in{max-width:1180px;margin:0 auto;padding:7px 16px;display:flex;gap:6px 18px;align-items:center;justify-content:center;flex-wrap:wrap}.ecobar a{color:#cfcfcf;text-decoration:none;white-space:nowrap}.ecobar a b{color:#fff;font-weight:600}.ecobar a.on{color:#fff;border-bottom:1px solid #fff}.ecobar span{opacity:.55}@media(max-width:600px){.ecobar .in{gap:4px 16px;font-size:12px;flex-wrap:nowrap}.ecobar .lbl,.ecobar a span{display:none}}</style></head>
<body><div class="ecobar" id="ecobar"><div class="in"><span class="lbl">Ekosistem FA:</span><a href="https://faindonesia.co.id/" class=on><b>FA Indonesia</b> <span>Kredit, Investor, IPO</span></a><a href="https://cariakuntan.com/"><b>Cari Akuntan</b> <span>KAP, KJA, Pajak</span></a><a href="https://updatesak.com/"><b>Update SAK</b> <span>Standar Akuntansi</span></a></div></div>
<main>
<small>FA Indonesia</small>
<h1>Admin Asisten AI</h1>
<section>
<h2>Kunci Admin</h2>
<label for="k">AI_ADMIN_KEY</label>
<input autocomplete="off" id="k" placeholder="Disimpan di perangkat ini saja" type="password"/>
<p class="mut">Status: <span id="st">memeriksa...</span></p>
</section>
<section>
<h2>Terbitkan Kode Kredit</h2>
<label for="pk">Paket</label>
<select id="pk"><option value="50">50 pertanyaan (Rp25.000)</option><option value="300">300 pertanyaan (Rp99.000)</option><option value="0">Jumlah lain</option></select>
<div id="cw" style="display:none"><label for="cr">Jumlah Pertanyaan</label><input id="cr" max="5000" min="1" type="number" value="100"/></div>
<label for="nt">Catatan (Nama, WA, Ref QRIS)</label>
<input id="nt" maxlength="200"/>
<button id="mk" type="button">Terbitkan Kode</button>
<div class="out" id="o1"></div>
</section>
<section>
<h2>Cek Sisa Kredit</h2>
<label for="cc">Kode</label>
<input id="cc" placeholder="FAI-XXXX-XXXX-XXXX"/>
<button id="ck" type="button">Cek</button>
<div class="out" id="o2"></div>
</section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
$("k").value=ls("fa_ai_admin")||"";
$("k").onchange=function(){ls("fa_ai_admin",$("k").value.trim())};
$("pk").onchange=function(){$("cw").style.display=$("pk").value==="0"?"":"none"};
fetch("/api/ai/status").then(function(r){return r.json()}).then(function(j){$("st").textContent=j.enabled?"aktif":"belum aktif (API key atau KV FA_AI belum dipasang)"}).catch(function(){$("st").textContent="worker tidak menjawab"});
$("mk").onclick=function(){
  var n=$("pk").value==="0"?+$("cr").value:+$("pk").value;$("o1").textContent="Memproses...";
  fetch("/api/ai/admin/new",{method:"POST",headers:{"content-type":"application/json","x-admin":$("k").value.trim()},body:JSON.stringify({credits:n,note:$("nt").value})})
  .then(function(r){return r.json()}).then(function(j){
    if(!j.code){$("o1").textContent=j.error||"Gagal";return}
    $("o1").innerHTML='<div class="code">'+j.code+'</div>'+j.credits+' pertanyaan\n\nTeks untuk WhatsApp:\nTerima kasih, pembayaran Paket Asisten AI sudah kami terima. Kode kredit Anda: '+j.code+' ('+j.credits+' pertanyaan). Masukkan di tombol Asisten AI, pilih "Punya kode kredit?". Berlaku di semua aplikasi FA Indonesia, UpdateSAK, dan CariAkuntan.';
    $("nt").value="";
  }).catch(function(){$("o1").textContent="Koneksi gagal"});
};
$("ck").onclick=function(){
  fetch("/api/ai/credit?code="+encodeURIComponent($("cc").value.trim().toUpperCase())).then(function(r){return r.json()})
  .then(function(j){$("o2").textContent=j.credits!=null?("Sisa "+j.credits+" dari "+j.total+" pertanyaan"):(j.error||"Tidak dikenal")}).catch(function(){$("o2").textContent="Koneksi gagal"});
};
})();
</script>
<script defer="" src="/js/lead.js"></script></body>
</html>
