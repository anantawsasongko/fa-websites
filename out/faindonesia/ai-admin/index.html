<style>
:root{--bg:#121212;--card:#1E1E1E;--line:#2F2F2F;--ink:#fff;--mut:#A8A8A8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px 60px}

.code{font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.04em;color:#fff}

<body><div class="ecobar" id="ecobar"><div class="in"><span class="lbl">Ekosistem FA:</span><a href="https://faindonesia.co.id/" class=on><b>FA Indonesia</b> <span>Kredit, Investor, IPO</span></a><a href="https://cariakuntan.com/"><b>Cari Akuntan</b> <span>KAP, KJA, Pajak</span></a><a href="https://updatesak.com/"><b>Update SAK</b> <span>Standar Akuntansi</span></a></div></div>
<main>
<small>FA Indonesia</small>
<h1>Admin Asisten AI</h1>
<section>
<h2>Kunci Admin</h2>
<label for="k">AI_ADMIN_KEY</label>
<input autocomplete="off" id="k" placeholder="Disimpan di perangkat ini saja" type="password"/>
<p class="mut">Status: <span id="st">memeriksa...</span></p>
</section>
<section>
<h2>Terbitkan Kode Kredit</h2>
<label for="pk">Paket</label>
<select id="pk"><option value="50">50 pertanyaan (Rp25.000)</option><option value="300">300 pertanyaan (Rp99.000)</option><option value="0">Jumlah lain</option></select>
<div id="cw" style="display:none"><label for="cr">Jumlah Pertanyaan</label><input id="cr" max="5000" min="1" type="number" value="100"/></div>
<label for="nt">Catatan (Nama, WA, Ref QRIS)</label>
<input id="nt" maxlength="200"/>
<button id="mk" type="button">Terbitkan Kode</button>
<div class="out" id="o1"></div>
</section>
<section>
<h2>Cek Sisa Kredit</h2>
<label for="cc">Kode</label>
<input id="cc" placeholder="FAI-XXXX-XXXX-XXXX"/>
<button id="ck" type="button">Cek</button>
<div class="out" id="o2"></div>
</section>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
$("k").value=ls("fa_ai_admin")||"";
$("k").onchange=function(){ls("fa_ai_admin",$("k").value.trim())};
$("pk").onchange=function(){$("cw").style.display=$("pk").value==="0"?"":"none"};
fetch("/api/ai/status").then(function(r){return r.json()}).then(function(j){$("st").textContent=j.enabled?"aktif":"belum aktif (API key atau KV FA_AI belum dipasang)"}).catch(function(){$("st").textContent="worker tidak menjawab"});
$("mk").onclick=function(){
  var n=$("pk").value==="0"?+$("cr").value:+$("pk").value;$("o1").textContent="Memproses...";
  fetch("/api/ai/admin/new",{method:"POST",headers:{"content-type":"application/json","x-admin":$("k").value.trim()},body:JSON.stringify({credits:n,note:$("nt").value})})
  .then(function(r){return r.json()}).then(function(j){
    if(!j.code){$("o1").textContent=j.error||"Gagal";return}
    $("o1").innerHTML='<div class="code">'+j.code+'</div>'+j.credits+' pertanyaan\n\nTeks untuk WhatsApp:\nTerima kasih, pembayaran Paket Asisten AI sudah kami terima. Kode kredit Anda: '+j.code+' ('+j.credits+' pertanyaan). Masukkan di tombol Asisten AI, pilih "Punya kode kredit?". Berlaku di semua aplikasi FA Indonesia, UpdateSAK, dan CariAkuntan.';
    $("nt").value="";
  }).catch(function(){$("o1").textContent="Koneksi gagal"});
};
$("ck").onclick=function(){
  fetch("/api/ai/credit?code="+encodeURIComponent($("cc").value.trim().toUpperCase())).then(function(r){return r.json()})
  .then(function(j){$("o2").textContent=j.credits!=null?("Sisa "+j.credits+" dari "+j.total+" pertanyaan"):(j.error||"Tidak dikenal")}).catch(function(){$("o2").textContent="Koneksi gagal"});
};
})();
</script>
