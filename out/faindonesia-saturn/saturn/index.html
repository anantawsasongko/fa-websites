/* Layout: app shell. Top bar, phase rail on the left, workspace in the middle, workpaper drawer on the right. */

.brand{display:flex;align-items:center;gap:14px}.brand a.fa{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.brand .mk{height:40px;width:auto}.brand .bt{display:grid;gap:2px;line-height:1.1}.brand b{font-family:var(--display);font-size:21px;font-weight:400;color:#fff}.brand .bt small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#00abd6}.brand .sep{width:1px;height:34px;background:var(--line)}.brand .kap{display:flex;align-items:center;gap:8px}.brand .kaplogo{background:#fff;border-radius:6px;padding:3px 5px;display:inline-flex}.brand .kaplogo img{height:32px;width:auto}.brand .kap small{color:var(--muted)!important}.brand em{font-style:normal;font-size:13px;color:#fff}@media (max-width:760px){.brand .sep,.brand .kap .bt{display:none}}

.tl{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:14px}
.tl .track{position:absolute;left:8%;right:8%;top:15px;height:2px;background:var(--line)}
.tl .track i{display:block;height:100%;background:linear-gradient(90deg,#fff,#cfcfcf);width:0;transition:width 1.6s cubic-bezier(.3,.6,.2,1)}

.tl .nd{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:11px;color:var(--muted);transition:all .5s}

@media (max-width:700px){.tl{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}.tl .track{display:none}}

n."]],"tax":[["O.1","Rekonsiliasi Pendapatan Akuntansi dengan Pendapatan Pajak","ECP","PSP","Uji rekonsiliasi fiskal: laba akuntansi ke penghasilan kena pajak, beda tetap dan beda temporer."],["O.2","Provisi untuk Pajak Penghasilan","VP","PSP","Rekalkulasi pajak kini dan utang pajak; cocokkan dengan SPT dan pembayaran."],["O.3","Penurunan Nilai Aset Pajak Tangguhan","VR","PSP","Evaluasi keterpulihan aset pajak tangguhan berdasarkan proyeksi laba fiskal."],["O.4","Pergerakan Saldo Akun Pajak Penghasilan","VC","PSP","Susun mutasi saldo utang/piutang pajak: saldo awal + beban - pembayaran = saldo akhir."],["O.5","Provisi untuk Posisi Pajak Tertentu","VRP","PSP","Reviu SKP, keberatan, banding, dan posisi pajak tidak pasti; evaluasi provisi dan pengungkapannya."],["O.6","Dasar Pencatatan Transaksi dengan Pihak Terkait","VRP","PSP","Evaluasi dokumentasi transfer pricing dan perlakuan pajak transaksi pihak berelasi."]],"eq":[["T.1","Skedul Rekonsiliasi Ekuitas","CRP","PSP","Susun mutasi ekuitas: modal, tambahan modal disetor, saldo laba, OCI; cocokkan dengan akta dan laba periode."],["T.2","Notulen dan Transaksi Ekuitas","CP","PSP","Baca notulen RUPS dan akta perubahan; uji pencatatan transaksi ekuitas."],["T.3","Penyelidikan atas Perjanjian Opsi Saham","EVC","PSP","Identifikasi program opsi saham/MESOP dan evaluasi pencatatannya."],["T.4","Kesesuaian Pembayaran Dividen","C","PSP","Cocokkan dividen dengan keputusan RUPS dan bukti pembayaran."],["T.5","Klasifikasi Aset Neto dengan dan tanpa Pembatasan","P","Tambahan","Uji pemisahan aset neto dengan pembatasan dari pemberi sumber daya (ISAK 335)."]],"rev":[["UA.1","Tinjauan Analitis Keseluruhan untuk Akun Laba Rugi yang Signifikan","ECP","PSP","Bandingkan pendapatan bulanan tahun berjalan dengan tahun lalu, anggaran, dan data operasional; selidiki fluktuasi signifikan."],["UA.2","Prosedur Pengakuan Pendapatan","EVC","PSP","Uji lima langkah PSAK 115 atas sampel kontrak: kewajiban pelaksanaan, harga transaksi, saat pengakuan; vouching ke dokumen."],["UA.3","Uji Kelengkapan Penerimaan SPP Via Virtual Account","EC","Tambahan","Cocokkan data siswa dan tagihan SPP dengan penerimaan virtual account bank."]],"opx":[["VD.1","Analisis Konten pada Beban Umum Administrasi dan Beban Umum Lainnya","EVCP","PSP","Analisis isi akun beban umum per jenis; bandingkan dengan tahun lalu dan anggaran."],["VD.2","Tinjauan Dokumentasi Penunjang","EVC","PSP","Vouching sampel beban ke dokumen pendukung dan persetujuan."],["VD.3","Kelengkapan Konfirmasi dari Pengacara Perusahaan","CP","PSP","Cocokkan beban jasa hukum dengan daftar konsultan hukum yang dikirimi konfirmasi."]]}}}};

var GD={"sa":{"SA 200":"Tujuan keseluruhan auditor dan pelaksanaan audit berdasarkan Standar Audit","SA 210":"Persetujuan atas ketentuan perikatan audit","SA 220":"Pengendalian mutu untuk audit atas laporan keuangan","SA 230":"Dokumentasi audit","SA 240":"Tanggung jawab auditor terkait dengan kecurangan","SA 250":"Pertimbangan atas peraturan perundang-undangan","SA 260":"Komunikasi dengan pihak yang bertanggung jawab atas tata kelola","SA 265":"Pengomunikasian defisiensi dalam pengendalian internal","SA 300":"Perencanaan suatu audit atas laporan keuangan","SA 315":"Pengidentifikasian dan penilaian risiko kesalahan penyajian material","SA 320":"Materialitas dalam perencanaan dan pelaksanaan audit","SA 330":"Respons auditor terhadap risiko yang telah dinilai","SA 450":"Pengevaluasian atas kesalahan penyajian yang diidentifikasi","SA 500":"Bukti audit","SA 501":"Bukti audit: pertimbangan spesifik atas unsur pilihan (persediaan, litigasi, informasi segmen)","SA 505":"Konfirmasi eksternal","SA 510":"Perikatan audit tahun pertama: saldo awal","SA 520":"Prosedur analitis","SA 530":"Sampling audit","SA 540":"Audit atas estimasi akuntansi dan pengungkapan terkait","SA 550":"Pihak berelasi","SA 560":"Peristiwa kemudian","SA 570":"Kelangsungan usaha","SA 580":"Representasi tertulis","SA 600":"Audit atas laporan keuangan grup","SA 610":"Penggunaan pekerjaan auditor internal","SA 620":"Penggunaan pekerjaan pakar auditor","SA 700":"Perumusan opini dan pelaporan atas laporan keuangan","SA 701":"Pengomunikasian hal audit utama","SA 705":"Modifikasi terhadap opini","SA 706":"Paragraf penekanan suatu hal dan paragraf hal lain","Kode Etik":"Kode Etik Profesi Akuntan Publik (IAPI)"},"method":[["kerangka","Kerangka standar",["FA Saturn mengikuti Standar Audit (SA) dalam Standar Profesional Akuntan Publik (SPAP) yang ditetapkan IAPI. SA disusun berbasis International Standards on Auditing (ISA), jadi nomor SA sama dengan nomor ISA padanannya, misalnya SA 315 setara ISA 315 dan SA 330 setara ISA 330.","Teks resmi SA dapat dibaca gratis di situs IAPI. Halaman ini tidak menyalin teks standar; isinya ringkasan cara menerapkan standar dalam kertas kerja, dengan rujukan nomor SA supaya staf bisa membuka standar aslinya.","Standar akuntansi yang diuji mengikuti penomoran PSAK terbaru dalam SAK Online IAI (misalnya PSAK 115 pendapatan, PSAK 109 instrumen keuangan, PSAK 202 persediaan, PSAK 216 aset tetap, PSAK 116 sewa, PSAK 219 imbalan kerja) dan ISAK 335 untuk entitas nonlaba."]],["fase","Alur fase dan titik kunci",["Risk Based Audit. Seluruh alur FA Saturn berangkat dari risiko. Di Planning, auditor menentukan akun signifikan dan asersi relevan, lalu mengidentifikasi SCOT (Significant Class of Transactions), yaitu alur transaksi signifikan yang membentuk akun tersebut. Setiap SCOT wajib di-walkthrough (WT) untuk memahami alur, titik rawan salah saji, serta desain dan implementasi kontrol kunci. Hasil WT dan CRA menentukan apakah kontrol diuji (ToC) dan diandalkan, atau audit dijalankan dengan pendekatan substantif penuh.","Planning (indeks B): penerimaan perikatan, independensi, surat perikatan, pemahaman entitas, walkthrough, materialitas, CRA, strategi. Planning ditutup dengan ASM (Audit Plan Summary Memorandum). Execution baru terbuka setelah Partner menyetujui ASM.","Execution (indeks C sampai V dan X): pembaruan materialitas di awal execution, pengujian ITGC dan pengendalian (entitas Complex), program prosedur per akun, estimasi, jurnal, pihak berelasi. Execution ditutup dengan SRM (Summary Review Memorandum).","Completion (indeks A dan Z): rekap asersi dan neraca saldo audit, AJE dan salah saji tidak dikoreksi, peristiwa kemudian, kelangsungan usaha, representasi, komunikasi tata kelola, kesimpulan dan opini, draf LAI.","Kompleksitas entitas dinilai di B-1 dengan enam indikator. Dua indikator atau lebih berarti Complex: ada ITGC (B-5A, B-5E), walkthrough (B-6), uji pengendalian (B-6E), estimasi (X-1), pakar (B-9A), dan pihak berelasi rinci (X-3). Kurang dari dua berarti Non-Complex Entity (NCE): pemahaman pengendalian sederhana (B-6N) dan pendekatan substantif penuh."]],["materialitas","Materialitas: OM, PM, dan CT",["Overall materiality (OM) = benchmark × persentase. Benchmark lazim: pendapatan 0,5% sampai 2%, laba sebelum pajak 5% sampai 10%, total aset 0,5% sampai 2% (cocok untuk bank dan BPR), ekuitas atau aset neto 1% sampai 5% (cocok untuk yayasan). Alasan pemilihan wajib ditulis.","Performance materiality (PM) = 50% sampai 75% dari OM, lebih rendah bila ada riwayat salah saji atau risiko tinggi. PM dipakai untuk menentukan akun signifikan (saldo ≥ PM) dan besaran sampel.","Clearly trivial (CT) = 3% sampai 5% dari OM. Salah saji di bawah CT tidak perlu diakumulasi.","Di awal execution materialitas dihitung ulang dari neraca saldo final (B-7E). Bila OM final lebih rendah, sifat, saat, dan luas prosedur ditinjau ulang (SA 320)."]],["cra","Combined Risk Assessment (CRA)",["Risiko inheren (IR) dinilai per akun per asersi: rendah, sedang, tinggi, atau risiko signifikan (SR). Risiko signifikan selalu ada untuk pengabaian pengendalian oleh manajemen dan biasanya untuk pengakuan pendapatan (SA 240).","Risiko gabungan (CR) = IR dikombinasikan dengan keputusan mengandalkan pengendalian. Pengandalan hanya boleh bila entitas Complex dan uji pengendalian SCOT-nya efektif. Satu penyimpangan dari 25 sampel membuat kontrol tidak diandalkan dan CRA direvisi.","CR menentukan respons: Minimal cukup analitis substantif, Rendah sampai Tinggi butuh uji rinci dengan sampel makin besar. Risiko signifikan butuh prosedur yang dirancang khusus, tidak cukup analitis saja (SA 330)."]],["psp","Asersi dan Prosedur Substantif Primer (PSP)",["Asersi akun neraca: E keberadaan, V penilaian, C kelengkapan, R hak dan kewajiban, P penyajian dan pengungkapan. Asersi akun laba rugi: O keterjadian, M pengukuran, C kelengkapan, P penyajian dan pengungkapan.","Setiap akun memakai indeks baku: C Kas, D Efek, E Piutang, F Persediaan, G Beban dibayar dimuka, H Investasi pada afiliasi, I Pihak berelasi, J Aset keuangan jangka panjang, K Aset tetap, L Aset takberwujud, M Pinjaman, N Utang usaha, O Pajak, P Akrual dan kewajiban lain, Q Utang jangka panjang dan sewa, S Derivatif, komitmen, kontinjensi, T Ekuitas, UA sampai UC pendapatan, VA sampai VE beban.","PSP dilakukan untuk semua akun signifikan di semua penugasan, terlepas dari hasil CRA. CRA menentukan saat dan luasnya, serta prosedur tambahan yang perlu. Satu prosedur dapat menjawab beberapa asersi, dan satu asersi dapat dijawab beberapa prosedur.","Asersi dinyatakan terpenuhi (T) hanya bila semua prosedur relevan selesai tanpa pengecualian. T-K berarti terpenuhi setelah koreksi (AJE). TT berarti ada pengecualian yang belum diselesaikan. BD berarti masih ada prosedur relevan yang belum selesai."]],["bukti","Bukti, sampling, dan dokumentasi",["Bukti dari pihak ketiga (konfirmasi) lebih andal daripada bukti internal; bukti yang diperoleh auditor langsung (observasi, rekalkulasi) lebih andal daripada bukti tidak langsung (SA 500, SA 505).","Sampel ilustratif di FA Saturn: saldo dibagi PM final dikali faktor keyakinan (1; 1,6; 2,3 untuk risiko rendah, sedang, tinggi), dibatasi 15, 30, dan 60, sebelum stratifikasi dan pemilihan item kunci. Pertimbangan profesional tetap berlaku (SA 530).","Setiap KK harus bisa dipahami auditor berpengalaman yang tidak ikut perikatan: sifat, saat, luas prosedur, hasil, kesimpulan, siapa mengerjakan dan siapa me-review (SA 230). Pakai tickmark baku di sheet Keterangan.","Upload ulang KK membatalkan sign-off. Arsip final disusun paling lambat 60 hari setelah tanggal laporan auditor."]],["evaluasi","Evaluasi salah saji dan opini",["Semua salah saji di atas CT dicatat di A-2: AJE yang disetujui manajemen mengalir ke saldo audit; yang tidak dikoreksi dievaluasi terhadap OM secara individual dan agregat (SA 450).","Opini: Wajar Tanpa Modifikasian bila bukti cukup dan salah saji tidak dikoreksi tidak material. Wajar Dengan Pengecualian bila material tetapi tidak pervasif, atau ada pembatasan ruang lingkup yang tidak pervasif. Tidak Wajar bila material dan pervasif. Tidak Menyatakan Pendapat bila pembatasan ruang lingkup pervasif (SA 700, SA 705).","Paragraf penekanan suatu hal atau hal lain ditambahkan bila perlu, termasuk ketidakpastian material terkait kelangsungan usaha (SA 570, SA 706)."]]],"g":{"B-1":["Memahami profil klien dan menetapkan apakah entitas Complex atau Non-Complex, karena itu menentukan task yang muncul.",["SA 220","SA 300","SA 315"],["Isi profil industri: model bisnis, sistem informasi manajemen dan akuntansi, pedoman akuntansi, perpajakan, dan pedoman audit. Template sudah berisi uraian awal sesuai industri, sesuaikan dengan klien.","Cocokkan daftar akun khas dan SCOT dengan neraca saldo klien.","Jawab enam indikator kompleksitas Ya/Tidak dengan keterangan. Dua Ya atau lebih berarti Complex.","Tuliskan kesimpulan kompleksitas dan dampaknya ke rencana kerja."],["Kesimpulan Complex/NCE konsisten dengan jawaban indikator.","Profil industri sudah disesuaikan, bukan salinan template."]],"B-2":["Memutuskan apakah perikatan diterima atau dilanjutkan dengan mempertimbangkan integritas klien, kompetensi tim, dan risiko perikatan.",["SA 220","SA 210"],["Jawab seluruh pertanyaan penerimaan dan lampirkan bukti (hasil penelusuran manajemen, komunikasi dengan auditor pendahulu untuk klien baru).","Catat pengguna laporan (bank, investor, regulator) karena memengaruhi risiko perikatan.","Tulis kesimpulan: diterima, dilanjutkan, atau ditolak, dengan alasan."],["Komunikasi auditor pendahulu terdokumentasi untuk klien baru.","Imbalan jasa tidak mengancam independensi."]],"B-3":["Memastikan setiap anggota tim independen dan ancaman etika sudah diberi pengamanan.",["Kode Etik","SA 220"],["Setiap anggota tim mengisi pernyataan independensi.","Identifikasi ancaman (kepentingan pribadi, telaah pribadi, advokasi, kedekatan, intimidasi) beserta pengamanannya.","Catat tahun ke berapa Partner dan KAP mengaudit klien (rotasi)."],["Semua anggota tim, termasuk pakar, sudah menandatangani.","Jasa non-audit kepada klien sudah dievaluasi."]],"B-4":["Menyepakati ketentuan perikatan secara tertulis sebelum pekerjaan dimulai.",["SA 210"],["Sesuaikan nama klien, kerangka pelaporan (SAK, SAK EP, SAK EMKM, ketentuan OJK, ISAK 335), dan periode.","Isi jadwal, tim, imbalan jasa, dan termin.","Pastikan surat ditandatangani kedua pihak sebelum fieldwork."],["Kerangka pelaporan di surat perikatan sama dengan yang dipakai di LK."]],"B-5":["Memahami entitas, lingkungan, dan pengendalian internalnya untuk mengidentifikasi risiko salah saji material.",["SA 315"],["Uraikan industri, regulasi, kepemilikan, operasi, kebijakan akuntansi, tujuan dan strategi, serta pengukuran kinerja.","Uraikan lima komponen pengendalian internal dan kelemahan yang terlihat.","Lakukan prosedur analitis awal atas neraca saldo dan catat fluktuasi tidak biasa."],["Setiap risiko yang ditemukan diteruskan ke CRA (B-8)."]],"B-5A":["Memahami aplikasi, infrastruktur TI, dan kontrol umum TI yang memengaruhi pelaporan keuangan.",["SA 315"],["Daftar aplikasi yang menghasilkan angka LK (ERP, core banking, PMS, SIMRS, POS).","Nilai desain kontrol akses, perubahan program, pengembangan, dan operasi komputer.","Tandai area yang akan diuji di B-5E."],["Aplikasi yang diandalkan kontrol otomatisnya sudah tercakup."]],"B-5E":["Menguji efektivitas operasi kontrol umum TI sebelum kontrol aplikasi diandalkan.",["SA 330"],["Untuk setiap area ITGC, catat kontrol, sampel bukti, dan penyimpangan.","Satu penyimpangan berarti kontrol aplikasi terkait tidak dapat diandalkan; beri tahu Senior untuk revisi CRA."],["Sampel mencakup seluruh periode, bukan hanya akhir tahun."]],"B-6":["Risk Based Audit: identifikasi SCOT (Significant Class of Transactions) dari akun signifikan dan asersi relevan, lalu walkthrough (WT) satu transaksi per SCOT dari awal sampai tercatat di LK untuk memahami alur, titik rawan salah saji, dan kontrol kunci.",["SA 315"],["Satu sheet per SCOT berisi kontrol kunci yang sudah terisi sesuai industri.","Isi langkah walkthrough: tanggal, dokumen, uraian, dan kontrol yang diamati.","Simpulkan apakah desain dan implementasi kontrol memadai."],["Dokumen walkthrough dilampirkan dengan nomor referensi."]],"B-6E":["Menguji efektivitas operasi kontrol kunci pada SCOT yang akan diandalkan, setelah WT menyimpulkan desain dan implementasinya memadai.",["SA 330","SA 530"],["Pilih 25 sampel sepanjang periode untuk tiap SCOT.","Isi V (sesuai), X (penyimpangan), atau NA untuk tiap kontrol K1, K2, dan seterusnya.","Kesimpulan terisi otomatis. Satu penyimpangan berarti kontrol tidak diandalkan: revisi CRA akun terkait menjadi substantif penuh."],["Sampel dipilih acak atau sistematis, bukan hanya transaksi mudah."]],"B-6N":["Untuk entitas Non-Complex: memahami alur dan kontrol yang relevan tanpa menguji efektivitasnya.",["SA 315","SA 330"],["Uraikan alur singkat tiap SCOT, kontrol yang diamati, dan risiko yang muncul.","Pendekatan audit: substantif penuh, tanpa mengandalkan kontrol."],["Risiko yang muncul diteruskan ke CRA."]],"B-7":["Menetapkan materialitas keseluruhan, materialitas pelaksanaan, dan clearly trivial di planning.",["SA 320"],["Isi benchmark dari prognosa atau neraca saldo interim.","Pilih benchmark dan persentase dari dropdown, lalu tulis alasannya.","Hasil OM, PM, dan CT terisi otomatis."],["Benchmark sesuai pengguna utama LK (laba untuk perusahaan, total aset untuk bank, aset neto untuk yayasan)."]],"B-7E":["Menghitung ulang materialitas dari neraca saldo final di awal execution.",["SA 320","SA 450"],["Isi kolom Final dari neraca saldo final.","Bila OM final lebih rendah dari planning, tinjau ulang sifat, saat, dan luas prosedur, lalu catat keputusannya."],["PM final dipakai di semua KK akun dan A-2."]],"B-8":["Menilai risiko inheren per asersi, memutuskan pengandalan kontrol, dan menentukan respons per akun.",["SA 315","SA 330","SA 240"],["Isi saldo dan PM, lalu nilai IR per asersi (R, S, T, SR).","Isi Y pada kolom Andalkan Kontrol hanya untuk entitas Complex dengan ToC efektif.","CR per asersi, CR akun, pendekatan, dan sampel terisi otomatis.","Daftarkan risiko signifikan dan respons khususnya. Pengabaian pengendalian oleh manajemen selalu ada."],["Pengakuan pendapatan dipertimbangkan sebagai risiko signifikan, atau alasan tidak dianggap signifikan ditulis."]],"B-9":["Menyusun strategi dan rencana audit menyeluruh berdasarkan hasil planning.",["SA 300"],["Isi ruang lingkup, jadwal, tim, materialitas (dari B-7), risiko signifikan dan respons, pendekatan per akun (dari B-8), serta rencana penggunaan pakar."],["Rencana konsisten dengan B-7 dan B-8."]],"B-9A":["Merencanakan penggunaan pakar, auditor internal, atau auditor komponen.",["SA 620","SA 610","SA 600"],["Untuk setiap pihak, nilai kompetensi, objektivitas, lingkup pekerjaan, dan cara mengevaluasi hasilnya."],["Laporan aktuaris dan penilai sudah dievaluasi asumsinya."]],"B-10":["Merangkum planning untuk persetujuan Partner. Execution baru terbuka setelah ASM disetujui.",["SA 300","SA 230"],["Di app, klik Susun ASM dari data engagement setelah semua task planning selesai.","Bila memakai template Word, isi ringkasan entitas, materialitas, risiko signifikan, strategi, dan hal yang perlu perhatian Partner."],["Semua task planning sudah sign-off sampai Senior Manager."]],"X-1":["Menguji estimasi akuntansi signifikan: metode, asumsi, dan data.",["SA 540"],["Daftarkan estimasi (CKPN, penyusutan, imbalan kerja, provisi, NRV).","Bandingkan nilai manajemen dengan estimasi atau rentang auditor, lalu simpulkan.","Reviu retrospektif estimasi tahun lalu terhadap realisasinya."],["Asumsi kunci didukung data independen."]],"X-2":["Merespons risiko pengabaian pengendalian oleh manajemen melalui pengujian jurnal.",["SA 240"],["Pilih jurnal berdasarkan kriteria: manual, akhir periode, akun jarang dipakai, angka bulat, pembuat tidak biasa.","Vouching ke dokumen pendukung dan otorisasi, lalu simpulkan hasilnya.","Reviu bias estimasi dan transaksi signifikan di luar kegiatan normal."],["Populasi jurnal lengkap dan direkonsiliasi ke buku besar."]],"X-3":["Mengidentifikasi pihak berelasi dan transaksinya, serta menilai pengungkapannya.",["SA 550"],["Bandingkan daftar dari manajemen dengan akta, register pemegang saham, dan buku besar.","Telusuri transaksi di luar kegiatan normal dan nilai kewajarannya."],["Semua pihak berelasi diungkapkan di CALK."]],"X-4":["Mengendalikan proses konfirmasi eksternal dari pemilihan sampai evaluasi jawaban.",["SA 505"],["Catat setiap konfirmasi: indeks KK, pihak, jenis, cara verifikasi alamat, tanggal kirim, follow-up, dan tanggal terima.","Konfirmasi dikirim dan diterima langsung oleh auditor, bukan lewat klien.","Untuk yang tidak kembali, lakukan prosedur alternatif dan catat ref KK-nya."],["Alamat atau email pihak ketiga diverifikasi independen.","Selisih konfirmasi sudah direkonsiliasi."]],"SRM":["Merangkum hasil execution untuk persetujuan Partner. Completion baru terbuka setelah SRM disetujui.",["SA 220","SA 230","SA 450"],["Di app, klik Susun SRM setelah semua task execution selesai.","Bila memakai template Word, isi materialitas final, hasil pengujian dan AJE, salah saji tidak dikoreksi, kontrol tidak efektif, dan isu signifikan."],["Tidak ada review note terbuka."]],"A-1":["Menyajikan neraca saldo audit dan rekap jawaban asersi per akun sebagai dasar kesimpulan.",["SA 330","SA 500","SA 230"],["Isi saldo 2024 audit, 2025 per buku, dan AJE per akun.","Salin jawaban asersi (E/O, V/M, C, R, P) dari bagian B Lead tiap akun.","Kesimpulan akun dan ringkasan terisi otomatis."],["Tidak ada asersi TT atau BD tersisa sebelum SRM."]],"A-2":["Mencatat AJE dan mengevaluasi salah saji tidak dikoreksi terhadap materialitas.",["SA 450"],["Isi OM, PM, dan CT final.","Catat setiap AJE: uraian, akun, jumlah, indeks, asersi, dampak laba, dan persetujuan manajemen.","Catat salah saji tidak dikoreksi beserta jenisnya (faktual, pertimbangan, proyeksi). Evaluasi terisi otomatis."],["Salah saji di bawah CT tidak dicatat.","AJE yang tidak disetujui manajemen dipindah ke bagian B."]],"Z-1":["Mengidentifikasi peristiwa setelah tanggal neraca yang memerlukan penyesuaian atau pengungkapan.",["SA 560"],["Lakukan dan dokumentasikan prosedur: baca notulen, LK interim terbaru, tanya litigasi, reviu transaksi signifikan setelah tanggal neraca."],["Prosedur dilakukan sampai mendekati tanggal LAI."]],"Z-2":["Menilai apakah ada ketidakpastian material terkait kelangsungan usaha.",["SA 570"],["Centang indikator, evaluasi rencana manajemen, lalu simpulkan dampaknya ke laporan auditor."],["Kesimpulan konsisten dengan Z-5."]],"Z-3":["Memperoleh representasi tertulis dari manajemen.",["SA 580"],["Sesuaikan isi dengan kondisi klien. Tanggal surat sama dengan tanggal LAI."],["Ditandatangani Direktur Utama dan Direktur Keuangan."]],"Z-4":["Mengomunikasikan hal penting kepada pihak yang bertanggung jawab atas tata kelola.",["SA 260","SA 265"],["Catat hal yang dikomunikasikan, tanggal, media, dan tanggapan, termasuk defisiensi signifikan pengendalian."],["Defisiensi signifikan dikomunikasikan tertulis."]],"Z-5":["Merumuskan opini berdasarkan seluruh bukti dan evaluasi salah saji.",["SA 700","SA 705","SA 706"],["Rangkum materialitas final, AJE, salah saji tidak dikoreksi, dan hasil A-1.","Jawab pertimbangan sebelum opini, lalu tentukan jenis opini dan paragraf tambahan."],["Opini konsisten dengan A-2, Z-2, dan representasi."]],"Z-6":["Menyiapkan draf laporan auditor independen.",["SA 700","SA 701","SA 705","SA 706"],["Sesuaikan struktur dan isi dengan jenis opini dari Z-5. Hal audit utama (SA 701) hanya untuk entitas yang diwajibkan."],["Nomor izin AP dan tanggal laporan sudah benar."]]},"acct":["Memperoleh bukti cukup dan tepat bahwa setiap asersi akun ini terpenuhi.",["SA 330","SA 500","SA 520","SA 530"],["Sheet Lead bagian A: isi sub-akun, saldo 2024 audit, 2025 per buku, dan AJE. PM final dan CRA diambil dari B-7E dan B-8.","Sheet Program: daftar PSP whitepaper dan prosedur tambahan industri, dengan tanda X untuk asersi yang dijawab. Tidak perlu diisi; status terisi otomatis.","Sheet KK anak (satu per prosedur): kerjakan pengujian di bagian C, lalu isi Status (Selesai/Belum/Tidak Relevan), Hasil (Sesuai/Pengecualian/Koreksi AJE), dan Ref AJE di bagian A.","Lead bagian B menunjukkan jawaban tiap asersi secara otomatis: T, T-K, TT, atau BD. Tulis kesimpulan auditor di bagian C, lalu salin jawabannya ke A-1."],["Saldo per buku di Lead cocok dengan neraca saldo.","Setiap pengecualian punya penjelasan dan, bila perlu, AJE di A-2.","Prosedur yang dinyatakan Tidak Relevan disertai alasan di KK anak."]]};

  var g=grpSum(main),gp=grpSum(main,'p');c.hasPy=main.rows.some(function(r){return r.p!=null});
  c.acc=cfg.acc.filter(function(a){return Math.abs(g[a[0]]||0)>=1}).map(function(a){return [a[0],a[1],Math.abs(g[a[0]])/1e6,a[3],a[4]]});
  c.py={};if(c.hasPy)c.acc.forEach(function(a){c.py[a[0]]=Math.abs(gp[a[0]]||0)/1e6});
  c.base={plan:baseOf(c.tb.plan||main),exec:baseOf(main)};syncCust()}

function procGL(){var P=PEND,c=P.cols;
  if(c.c==null||(c.d==null&&c.k==null)){toast('Pilih minimal kolom kode akun dan debit/kredit.');return}
  var rows=[];for(var i=P.hr+1;i<P.rows.length;i++){var r=P.rows[i]||[],code=cellv(r,c.c);if(code==null||String(code).trim()==='')continue;
    var d=pnum(cellv(r,c.d))||0,k=pnum(cellv(r,c.k))||0;if(!d&&!k)continue;
    rows.push({t:pdate(cellv(r,c.t)),v:c.v!=null&&cellv(r,c.v)!=null?String(cellv(r,c.v)).trim():'',c:String(code).trim(),x:c.x!=null&&cellv(r,c.x)!=null?String(cellv(r,c.x)):'',d:d,k:k,u:c.u!=null&&cellv(r,c.u)!=null?String(cellv(r,c.u)):''})}
  if(!rows.length){toast('Tidak ada baris jurnal yang terbaca. Cek pilihan kolom.');return}
  GLRAW=rows;S.cust.gl=analyzeGL(rows,P.f);PEND=null;toast('GL terbaca: '+nf.format(rows.length)+' baris, '+nf.format(S.cust.gl.nv)+' jurnal.');render()}
function analyzeGL(rows,fname){var fy=FYY(),end=new Date(fy,11,31),cut=new Date(fy,11,24),pmR=(I().base.exec?mat('exec').pm:0)*1e6;
  var td=0,tk=0,acct={},vou={},vk=[];
  rows.forEach(function(r,i){td+=r.d;tk+=r.k;acct[r.c]=(acct[r.c]||0)+r.d-r.k;
    var key=r.v?r.v+'|'+(r.t?r.t.toISOString().slice(0,10):''):'row'+i;if(!vou[key]){vou[key]={v:r.v||'(tanpa nomor)',t:r.t,d:0,k:0,mx:0,ac:{},x:r.x,u:r.u,n:0};vk.push(key)}
    var o=vou[key];o.d+=r.d;o.k+=r.k;o.mx=Math.max(o.mx,r.d,r.k);o.ac[r.c]=1;o.n++;if(!o.x&&r.x)o.x=r.x});
  var use={};vk.forEach(function(k){Object.keys(vou[k].ac).forEach(function(a){use[a]=(use[a]||0)+1})});
  var CR=[['wk','Tanggal akhir pekan'],['pe','7 hari terakhir periode atau setelah tanggal neraca'],['rd','Angka bulat (kelipatan Rp1 jt, minimal Rp10 jt)'],['kw','Kata kunci koreksi/penyesuaian/manual'],['pm','Nilai ≥ PM'],['ra','Memakai akun jarang (≤ 2 jurnal)'],['ub','Jurnal tidak seimbang']];
  var cnt={},fl=[];CR.forEach(function(c){cnt[c[0]]=0});
  vk.forEach(function(k){var o=vou[k],f=[];
    if(o.t){var dw=o.t.getDay();if(dw===0||dw===6)f.push('wk');if(o.t>=cut)f.push('pe')}
    if(o.mx>=1e7&&Math.abs(o.mx%1e6)<1)f.push('rd');
    if(/(koreksi|penyesuaian|adjust|reklas|reclass|manual|memorial|jurnal umum|jv|balik|reverse|batal|selisih|write ?off|hapus)/i.test(o.x||''))f.push('kw');
    if(pmR&&o.mx>=pmR)f.push('pm');
    if(Object.keys(o.ac).some(function(a){return use[a]<=2}))f.push('ra');
    if(Math.abs(o.d-o.k)>=1)f.push('ub');
    f.forEach(function(x){cnt[x]++});
    if(f.length)fl.push({v:o.v,t:o.t?o.t.toISOString().slice(0,10):'',x:(o.x||'').slice(0,90),u:o.u||'',amt:Math.max(o.d,o.k),f:f,s:f.length+(f.indexOf('pm')>=0?1:0)})});
  fl.sort(function(a,b){return b.s-a.s||b.amt-a.amt});
  var dmin=null,dmax=null;rows.forEach(function(r){if(r.t){if(!dmin||r.t<dmin)dmin=r.t;if(!dmax||r.t>dmax)dmax=r.t}});
  return{f:fname,at:now(),n:rows.length,nv:vk.length,td:td,tk:tk,acct:acct,cnt:cnt,crit:CR,flags:fl.slice(0,150),nflag:fl.length,from:dmin?dmin.toISOString().slice(0,10):'',to:dmax?dmax.toISOString().slice(0,10):'',ub:cnt.ub}}
function glRecon(){var g=S.cust.gl,tb=tbMain();if(!g||!tb)return[];var codes={},out=[];
  tb.rows.forEach(function(r){if(r.c)codes[r.c]=r});
  Object.keys(codes).forEach(function(c){var r=codes[c],mv=g.acct[c]||0,exp=(S.cust.hasPy?(r.p||0):0)+mv;out.push({c:c,n:r.n,tb:r.b,py:r.p,mv:mv,exp:exp,diff:r.b-exp})});
  Object.keys(g.acct).forEach(function(c){if(!codes[c])out.push({c:c,n:'(tidak ada di TB)',tb:0,py:null,mv:g.acct[c],exp:g.acct[c],diff:-g.acct[c]})});
  return out}

function pstate(k){if(isCli()){var pend0=phaseLocked('E'),m0=S.cust.ps[k]||{},t0=T(accIdx(k));var out0=procsOf(k).map(function(p){var r=m0[p[0]]||{},raw=pend0?'Belum':(r.st||'Belum');return{ref:p[0],t:p[1],a:p[2],src:p[3],raw:raw,st:raw==='Belum'?'Belum':'Selesai',h:raw==='Selesai'?(r.h||'Sesuai'):raw==='Tidak Relevan'?'Tidak relevan':'',aje:raw==='Selesai'&&r.h==='Koreksi (AJE)'?(r.aje||''):''}});
  if(!pend0)t0.n.forEach(function(nt){if(nt.status!=='open'||!nt.asr)return;var o=out0.find(function(q){return q.a.indexOf(nt.asr)>=0});if(o){o.st='Selesai';o.h='Pengecualian';o.note=1}});return out0}
  var ps=procsOf(k),t=T(accIdx(k)),n=ps.length,out=[];
  var pend=phaseLocked('E')||!t.v.length,fin=done(t);
  ps.forEach(function(p,i){out.push({ref:p[0],t:p[1],a:p[2],src:p[3],st:pend?'Belum':(fin||i<Math.ceil(n/2))?'Selesai':'Belum',h:''})});
  out.forEach(function(o){if(o.st==='Selesai')o.h='Sesuai'});
  if(!pend){
    t.n.forEach(function(nt){if(nt.status!=='open'||!nt.asr)return;var o=out.find(function(q){return q.a.indexOf(nt.asr)>=0});if(o){o.st='Selesai';o.h='Pengecualian';o.note=1}});
    ajeFor(k).forEach(function(j){var o=out.find(function(q){return q.a.indexOf(j.asr)>=0&&q.st==='Selesai'&&q.h==='Sesuai'});if(o){o.h='Koreksi (AJE)';o.aje=j.ref}});}
  return out}
function result(k,x){
  if(rel(k).indexOf(x)<0)return'NA';var ps=pstate(k).filter(function(p){return p.a.indexOf(x)>=0});
  if(ps.some(function(p){return p.h==='Pengecualian'}))return'TT';
  if(ps.some(function(p){return p.st!=='Selesai'}))return'BD';
  return ps.some(function(p){return p.h==='Koreksi (AJE)'})?'TK':'T';
}
function accStatus(k){var r=rel(k).map(function(x){return result(k,x)});
  if(r.indexOf('TT')>=0)return{c:'bad',l:'Belum terpenuhi'};if(r.indexOf('BD')>=0)return{c:'wip',l:'Pengujian belum selesai'};
  if(r.indexOf('TK')>=0)return{c:'',l:'Wajar setelah penyesuaian audit'};return{c:'',l:'Wajar, tidak ada salah saji'}}

  lbl={WTM:'Wajar Tanpa Modifikasian',WDP:'Wajar Dengan Pengecualian',TW:'Tidak Wajar',TMP:'Tidak Menyatakan Pendapat'}[code];
  return{code:code,l:lbl,sum:sumT,material:material,scope:scope,gc:o.gc}}

    else if(isMemo&&!gate(t))why='Semua task di fase ini harus selesai dulu.';else why='Menunggu sign-off level di bawah Anda.'}
  if(r==='partner'&&!isMemo)why=why||'Partner me-review lewat dashboard dan menyetujui ASM, SRM, serta LAI.';
  var notes=t.n.map(function(n){return '<div class="note '+(n.status==='cleared'?'cl':'')+'"><div class="meta"><span>'+esc(first(n.role))+' · '+LV[n.role].l+(n.asr?' · asersi '+ASN(t.acc,n.asr):'')+'</span><span>'+(n.status==='open'?'Terbuka':'Clear')+' · '+fmt(n.at)+'</span></div><p>'+esc(n.text)+'</p>'+
    n.replies.map(function(p){return '<div class="rep"><span class="muted" style="font-size:12px">'+esc(first(p.role))+' · '+fmt(p.at)+'</span><br>'+esc(p.text)+'</div>'}).join('')+
    (n.status==='open'&&!locked()?'<div class="acts"><textarea id="rp-'+n.id+'" aria-label="Balasan" placeholder="Tulis jawaban atas note ini" style="min-height:52px"></textarea><button class="btn sm" data-action="reply" data-ref="'+t.ref+'" data-n="'+n.id+'">Kirim jawaban</button>'+(canClear(n,r)?'<button class="btn sm" data-action="clear" data-ref="'+t.ref+'" data-n="'+n.id+'">Clear note</button>':'')+'</div>':'')+'</div>'}).join('')||'<p class="hint">Belum ada review note.</p>';
  var add=canNote(t,r)?'<div style="margin-top:12px"><label for="newNote" class="hint" style="display:block;margin-bottom:6px">Review note baru sebagai '+LV[r].l+'</label>'+(t.kind==='acct'?'<select id="noteAsr" style="background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px"><option value="">Asersi terkait (opsional)</option>'+rel(t.acc).map(function(x){return '<option value="'+x+'">'+ASL(t.acc,x)+' · '+ASN(t.acc,x)+'</option>'}).join('')+'</select>':'')+'<textarea id="newNote" placeholder="Contoh: Sampel pisah batas belum mencakup lima hari kerja sebelum tanggal neraca."></textarea><div class="upl"><button class="btn pen sm" data-action="note" data-ref="'+t.ref+'">Tambah review note</button></div></div>':'';
  w.innerHTML='<div class="scrim" data-action="close"></div><aside class="drawer" role="dialog" aria-label="'+esc(t.ref+' '+t.title)+'"><div class="dhead"><div style="min-width:0"><span class="muted"><span class="idx">'+t.ref+'</span> '+esc(t.sa)+'</span><h3>'+esc(t.title)+'</h3><span class="pill '+st.c+'">'+st.l+'</span></div><button class="x" data-action="close" aria-label="Tutup">✕</button></div>'+
   '<div class="dbody"><section class="sec"><h2>'+(isMemo?'Memorandum':'Kertas kerja')+'</h2>'+guideHTML(t,!t.v.length)+wp+'</section><section class="sec"><h2>Sign-Off Berjenjang</h2><ul class="chain">'+chainH+'</ul>'+(why?'<p class="hint">'+why+'</p>':'')+'</section><section class="sec"><h2>Review Note</h2>'+notes+add+'</section></div></aside>'}

function render(enter){if(!isCli()&&(S.view==='lic'||S.view==='imp'||S.view==='gl'||S.view==='drv'))S.view='dash';renderTop();renderNav();var m=document.getElementById('main'),v=S.view;
  m.innerHTML=cliBanner(v)+(v==='start'?renderStart():v==='drv'?renderDrv():v==='lic'?renderLic():v==='imp'?renderImp():v==='gl'?renderGL():v==='dash'?renderDash():v==='profile'?renderProfile():v==='mat'?renderMat():v==='cra'?renderCRA():v==='wt'?renderWT():v==='tb'?renderTB():v==='acct'?renderAcct():v==='aje'?renderAJE():v==='op'?renderOp():v==='lib'?renderLib():v==='psp'?renderPSP():v==='met'?renderMet():renderPhase(v));
  if(enter){m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter')}
  S._flip=false;S.added={};renderDrawer();animate();save();render.n=1}

/* ---------- events ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b||b.disabled)return;var a=b.dataset.action,t=b.dataset.ref&&def(b.dataset.ref)?T(b.dataset.ref):null,st=t?ST(t.ref):null;
  if(a==='view'){S.view=b.dataset.v;S.open=null;render(true);window.scrollTo(0,0)}
  else if(a==='acct'){S.acct=b.dataset.a;S.view='acct';S.open=null;render(true);window.scrollTo(0,0)}
  else if(a==='open'){S.open=b.dataset.ref;render()}
  else if(a==='close'){S.open=null;render()}
  else if(a==='dlx'){toast(t?'Mengunduh '+tplName(t)+'. Baca petunjuk pengisian, isi sel kuning, lalu upload kembali.':'Mengunduh file.');return}
  else if(a==='mjump'){e.preventDefault();var el=document.getElementById(b.dataset.id);if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});return}
  else if(a==='gen'){st.v.unshift({f:t.ref+'_'+(t.kind==='asm'?'ASM':'SRM')+'_FY'+CY()+'.docx',by:S.role,at:now()});st.s={};toast((t.kind==='asm'?'ASM':'SRM')+' tersusun dari data engagement.');render()}
  else if(a==='sign'){st.s[S.role]={at:now()};toast(t.ref+(S.role==='partner'?' disetujui Partner.':' di-sign off oleh '+LV[S.role].l+'.')+(t.kind==='asm'&&S.role==='partner'?' Execution terbuka.':t.kind==='srm'&&S.role==='partner'?' Completion terbuka.':''));render()}
  else if(a==='unsign'){delete st.s[S.role];toast('Sign-off dibatalkan.');render()}
  else if(a==='unlock-asm'){delete ST('B-10').s.partner;toast('ASM dibuka untuk revisi. Execution terkunci sampai ASM disetujui lagi.');render()}
  else if(a==='note'){var v=document.getElementById('newNote').value.trim();if(!v){toast('Tulis isi review note dulu.');return}var as=document.getElementById('noteAsr');st.n.push({id:'n'+Date.now(),role:S.role,asr:as&&as.value?as.value:undefined,text:v,at:now(),status:'open',replies:[]});toast('Review note ditambahkan.');render()}
  else if(a==='reply'){var n=st.n.find(function(x){return x.id===b.dataset.n}),v2=document.getElementById('rp-'+n.id).value.trim();if(!v2){toast('Tulis jawaban dulu.');return}n.replies.push({role:S.role,text:v2,at:now()});render()}
  else if(a==='clear'){st.n.find(function(x){return x.id===b.dataset.n}).status='cleared';toast('Note di-clear.');render()}
  else if(a==='q'){if(!planEditable())return;var was=isCx(),before=list().map(function(x){return x.ref});S.ent[b.dataset.q]=!S.ent[b.dataset.q];
    if(was!==isCx()){S._flip=true;list().forEach(function(x){if(before.indexOf(x.ref)<0)S.added[x.ref]=1});var asm=ST('B-10');if(Object.keys(asm.s).length){asm.s={};asm.v=[]}
      toast(isCx()?'Entitas menjadi Complex: task TI, walkthrough, ToC, estimasi, dan pihak berelasi ditambahkan.':'Entitas menjadi Non-Complex: daftar task diringkas, pendekatan substantif.')}render()}
  else if(a==='ir'){var c=S.cra[b.dataset.a];c.ir[b.dataset.x]=IRL[(IRL.indexOf(c.ir[b.dataset.x])+1)%4];render();var nb=document.querySelector('.cell[data-a="'+b.dataset.a+'"][data-x="'+b.dataset.x+'"]');if(nb){nb.style.animationDelay='0s';nb.classList.add('pop')}}
  else if(a==='rely'){S.cra[b.dataset.a].rely=!S.cra[b.dataset.a].rely;render();document.querySelectorAll('.cell[data-a="'+b.dataset.a+'"]').forEach(function(x,i){x.style.animationDelay=(i*60)+'ms';x.classList.add('pop')})}
  else if(a==='exc'){var cy=b.dataset.c,was2=cycEff(cy);S.exc[cy]=Math.max(0,(S.exc[cy]||0)+(+b.dataset.d));if(was2!==cycEff(cy))toast(cycEff(cy)?'Kontrol kembali efektif: pengandalan kontrol dipulihkan di CRA.':'Kontrol tidak efektif: CRA akun terkait direvisi ke substantif penuh.');render()}
  else if(a==='op'){S.op[b.dataset.k]=b.dataset.v==='true';render()}
  else if(a==='sign-lai'){document.getElementById('modalWrap').innerHTML='<div class="modal"><div class="box" role="dialog" aria-label="Konfirmasi tanda tangan LAI"><h3>Tanda Tangani LAI?</h3><p>Opini: <b>'+opinion().l+'</b>. Setelah ditandatangani, engagement '+esc(I().client)+' dikunci dan arsip final wajib selesai dalam 60 hari.</p><div class="acts"><button class="btn" data-action="cancel-lai">Batal</button><button class="btn pri" data-action="do-lai">Tanda tangani</button></div></div></div>'}
  else if(a==='cancel-lai'){document.getElementById('modalWrap').innerHTML=''}
  else if(a==='do-lai'){S.locked=now();document.getElementById('modalWrap').innerHTML='';toast('LAI ditandatangani. Engagement terkunci.');render()}
  else if(a==='jump'){S.locked=null;['P','E','C'].forEach(function(p){list(p).forEach(function(x){var s=ST(x.ref);if(!s.v.length)s.v.unshift({f:x.ref+'_FY'+CY()+'_v1.'+(x.type==='x'?'xlsx':'docx'),by:'staf',at:now()});s.n.forEach(function(n){n.status='cleared'});chain(x).forEach(function(l){if(!s.s[l])s.s[l]={at:now()}})})});
    S.role='partner';S.view='dash';S.open=null;toast('Semua task selesai. Anda sekarang Partner.');render(true)}
  else if(a==='reset'){seed(S.ind);prevW={};prevN={};toast('Demo dikembalikan ke kondisi awal.');render(true)}
});
function onMat(e){var el=e.target;if(!el.dataset||!el.dataset.mat)return;var w=el.dataset.mat,k=el.dataset.k;
  if(w==='exec'&&!S.mat.exec.touched){var p=S.mat.plan;S.mat.exec={b:p.b,p:p.p,pm:p.pm,ct:p.ct,touched:true}}
  var m=S.mat[w];if(k==='b'){m.b=el.value;m.p=BENCH[el.value].def}else m[k]=+el.value;
  var y=window.scrollY;render();window.scrollTo(0,y);if(k==='p'){var nx=document.querySelector('[data-mat="'+w+'"][data-k="p"]');if(nx)nx.focus()}}
document.addEventListener('change',function(e){var id=e.target.id;
  if(id==='roleSel'){S.role=e.target.value;render();toast('Sekarang sebagai '+LV[S.role].l+'.');return}
  if(id==='indSel'){var v=S.view,r=S.role;seed(e.target.value);S.view=(v==='acct'?'tb':v);S.role=r;prevW={};prevN={};render(true);toast('Engagement diganti ke '+I().l+': '+I().client+' (dummy).');return}
  if(id==='up'&&e.target.files[0]){var st=ST(e.target.dataset.ref),f=e.target.files[0],had=Object.keys(st.s).length;st.v.unshift({f:f.name,by:S.role,at:now()});st.s={};toast(had?'Versi baru tersimpan. Sign-off direset.':'KK ter-upload.');render();return}
  if(id==='extra'){S.op.extra=+e.target.value;var y=window.scrollY;render();window.scrollTo(0,y);return}
  onMat(e)});
document.addEventListener('input',function(e){if(e.target.type==='range'&&e.target.dataset.mat)onMat(e)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.open){S.open=null;render()}});
render(true);
})();

</script>
